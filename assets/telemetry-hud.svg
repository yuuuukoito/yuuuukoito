<svg width="850" height="340" viewBox="0 0 850 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background & Glassmorphic Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0719"/>
      <stop offset="50%" stop-color="#150a2b"/>
      <stop offset="100%" stop-color="#090412"/>
    </linearGradient>
    
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1038" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#120724" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Neon Glow Effects -->
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Filters for Neon Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Sci-Fi Grid Pattern -->
    <pattern id="hudGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#7c3aed" stroke-width="0.5" stroke-opacity="0.08"/>
      <circle cx="30" cy="0" r="1" fill="#c084fc" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Outer Frame -->
  <rect width="850" height="340" rx="16" fill="url(#bgGrad)" stroke="#6b21a8" stroke-width="1.5"/>
  <rect width="850" height="340" rx="16" fill="url(#hudGrid)"/>
  
  <!-- Outer Sci-Fi Border Accents -->
  <path d="M 20 0 L 80 0 L 70 10 L 10 10 Z" fill="#7c3aed" opacity="0.6"/>
  <path d="M 830 0 L 770 0 L 780 10 L 840 10 Z" fill="#7c3aed" opacity="0.6"/>
  <path d="M 0 40 L 0 80 L 10 70 L 10 30 Z" fill="#38bdf8" opacity="0.4"/>
  <path d="M 850 40 L 850 80 L 840 70 L 840 30 Z" fill="#38bdf8" opacity="0.4"/>

  <!-- Top Header Section -->
  <g transform="translate(30, 24)">
    <!-- Status Dots -->
    <circle cx="10" cy="14" r="5" fill="#38bdf8" filter="url(#subtleGlow)"/>
    <circle cx="26" cy="14" r="5" fill="#c084fc" filter="url(#subtleGlow)"/>
    <circle cx="42" cy="14" r="5" fill="#fbbf24" filter="url(#subtleGlow)"/>

    <!-- Header Titles -->
    <text x="65" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e9d5ff" letter-spacing="1.5">HERTA SPACE STATION <tspan fill="#38bdf8">//</tspan> TELEMETRY &amp; RESEARCH HUD</text>
    <text x="65" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#a78bfa" letter-spacing="0.8">RESEARCHER: @yuuuukoito • CLEARANCE: Level 4 // Scholar • PATH: The Erudition 🔮</text>

    <!-- Top Right Status Pill -->
    <rect x="620" y="2" width="170" height="26" rx="13" fill="#1e1038" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="635" cy="15" r="4" fill="#10b981" filter="url(#subtleGlow)"/>
    <text x="646" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#34d399" letter-spacing="1">LINK: OPERATIONAL</text>
  </g>

  <!-- Divider Line -->
  <line x1="30" y1="75" x2="820" y2="75" stroke="#4c1d95" stroke-width="1" stroke-dasharray="4 4"/>
  <polygon points="425,71 430,75 425,79 420,75" fill="#c084fc"/>

  <!-- Left Panel: Activity & Streak Matrix -->
  <g transform="translate(30, 95)">
    <!-- Panel Background Frame -->
    <rect width="385" height="215" rx="12" fill="url(#panelGrad)" stroke="#581c87" stroke-width="1.2"/>
    
    <!-- Panel Header -->
    <path d="M 0 12 Q 0 0 12 0 L 373 0 Q 385 0 385 12 L 385 36 L 0 36 Z" fill="#2e1052" opacity="0.6"/>
    <text x="18" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#c084fc" letter-spacing="1">⚡ CONTRIBUTION &amp; STREAK METRICS</text>
    
    <!-- Metric 1: Total Commits & Contributions -->
    <g transform="translate(20, 52)">
      <!-- Commit Pill -->
      <rect width="165" height="68" rx="8" fill="#14092b" stroke="#7c3aed" stroke-width="1"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#a78bfa">TOTAL COMMITS (2026)</text>
      <text x="14" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff" filter="url(#subtleGlow)">21</text>
      <text x="60" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">commits</text>
    </g>

    <g transform="translate(198, 52)">
      <!-- Streak Pill -->
      <rect width="165" height="68" rx="8" fill="#14092b" stroke="#7c3aed" stroke-width="1"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#a78bfa">CURRENT STREAK</text>
      <text x="14" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#fbbf24" filter="url(#subtleGlow)">1 <tspan font-size="14">Day</tspan></text>
      <text x="110" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#f59e0b">🔥 Active</text>
    </g>

    <!-- Sub-metrics row -->
    <g transform="translate(20, 134)">
      <rect width="343" height="62" rx="8" fill="#170b30" stroke="#3b0764" stroke-width="1"/>
      
      <!-- Longest Streak -->
      <text x="15" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#9ca3af">LONGEST STREAK</text>
      <text x="15" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e9d5ff">2 Days</text>

      <line x1="140" y1="12" x2="140" y2="50" stroke="#4c1d95" stroke-width="1"/>

      <!-- Total Contributions -->
      <text x="155" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#9ca3af">TOTAL CONTRIBUTIONS</text>
      <text x="155" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#38bdf8">20 Actions</text>
    </g>
  </g>

  <!-- Right Panel: Language Resonance & Curio Tech Spectrum -->
  <g transform="translate(435, 95)">
    <!-- Panel Background Frame -->
    <rect width="385" height="215" rx="12" fill="url(#panelGrad)" stroke="#581c87" stroke-width="1.2"/>
    
    <!-- Panel Header -->
    <path d="M 0 12 Q 0 0 12 0 L 373 0 Q 385 0 385 12 L 385 36 L 0 36 Z" fill="#2e1052" opacity="0.6"/>
    <text x="18" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#c084fc" letter-spacing="1">🔮 LANGUAGE RESONANCE &amp; CURIO MATRIX</text>

    <!-- Language Meter 1: Primary Language -->
    <g transform="translate(20, 52)">
      <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#facc15">JavaScript</text>
      <text x="345" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#facc15" text-anchor="end">100%</text>
      
      <!-- Progress Bar Track -->
      <rect x="0" y="24" width="345" height="10" rx="5" fill="#190d33" stroke="#581c87" stroke-width="1"/>
      <rect x="0" y="24" width="345" height="10" rx="5" fill="url(#goldGlow)" filter="url(#subtleGlow)"/>
    </g>

    <!-- Tech Stack Quick Badges Grid -->
    <g transform="translate(20, 108)">
      <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#a78bfa" letter-spacing="0.8">ACTIVE SUBSYSTEMS &amp; TECH MATRIX</text>
      
      <!-- Badges -->
      <g transform="translate(0, 22)">
        <!-- Badge 1: Web & UI -->
        <rect x="0" y="0" width="105" height="24" rx="6" fill="#1a0e36" stroke="#7c3aed" stroke-width="1"/>
        <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#e9d5ff">🌐 Web &amp; Frontend</text>

        <!-- Badge 2: Arduino IoT -->
        <rect x="115" y="0" width="110" height="24" rx="6" fill="#1a0e36" stroke="#38bdf8" stroke-width="1"/>
        <text x="125" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">🤖 IoT &amp; Sensors</text>

        <!-- Badge 3: C++ & Embedded -->
        <rect x="235" y="0" width="110" height="24" rx="6" fill="#1a0e36" stroke="#fbbf24" stroke-width="1"/>
        <text x="245" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#fbbf24">⚙️ C++ / Embedded</text>
      </g>
    </g>

    <!-- Bottom Motto inside Panel -->
    <g transform="translate(20, 172)">
      <rect width="345" height="28" rx="6" fill="#140826" stroke="#4c1d95" stroke-width="1"/>
      <text x="172" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" font-style="italic" fill="#c084fc" text-anchor="middle">"Kuru kuru~ Kuru rin~! All curios online!" ✨</text>
    </g>
  </g>
</svg>